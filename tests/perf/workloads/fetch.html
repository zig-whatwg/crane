<!doctype html>
<meta charset="utf-8">
<title>Fetch and bodies</title>
<!-- Fetch from data: URLs and from the benchmark server on loopback (/__perf/bytes, /__perf/json,
     /encoded/*.gz and *.br with their Content-Encoding), bodies read whole and as a stream. -->
<script src="../harness.js"></script>
<script>
perf.add('fetch.data-url-text', {
  ops: 500,
  async run(n) { let k = 0; for (let i = 0; i < n; i++) k += (await (await fetch('data:text/plain,x')).text()).length; this.sink = k; },
});
perf.add('fetch.response-text', {
  ops: 5000,
  async run(n) { let k = 0; for (let i = 0; i < n; i++) k += (await new Response('x').text()).length; this.sink = k; },
});
perf.add('fetch.loopback-small', {
  ops: 200,
  async run(n) { let k = 0; for (let i = 0; i < n; i++) k += (await (await fetch('/__perf/bytes?n=1024')).text()).length; this.sink = k; },
});
perf.add('fetch.loopback-json', {
  ops: 20,
  async run(n) { let k = 0; for (let i = 0; i < n; i++) k += (await (await fetch('/__perf/json?n=2000')).json()).length; this.sink = k; },
});
perf.add('fetch.loopback-stream', {
  ops: 3,
  async run(n) {
    let k = 0;
    for (let i = 0; i < n; i++) {
      const reader = (await fetch('/__perf/bytes?n=4194304')).body.getReader();
      for (;;) { const { done, value } = await reader.read(); if (done) break; k += value.length; }
    }
    this.sink = k;
  },
});
// The same 1 MiB of HTML-shaped text, gzip- and br-encoded (tests/perf/encoded/README.md),
// read as a stream: each engine decodes the body as it arrives. A body that was not
// decoded (its length is not the text's) fails the workload rather than timing it.
const encodedTextLength = 1048583;
async function readEncoded(url, n) {
  let k = 0;
  for (let i = 0; i < n; i++) {
    const reader = (await fetch(url)).body.getReader();
    let length = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; length += value.length; }
    if (length !== encodedTextLength) throw new Error(`${url}: ${length} bytes, not ${encodedTextLength}`);
    k += length;
  }
  return k;
}
perf.add('fetch.loopback-gzip', {
  ops: 3,
  async run(n) { this.sink = await readEncoded('/encoded/text-1m.html.gz', n); },
});
perf.add('fetch.loopback-br', {
  ops: 3,
  async run(n) { this.sink = await readEncoded('/encoded/text-1m.html.br', n); },
});
</script>
