<!doctype html>
<meta charset="utf-8">
<title>innerHTML churn</title>
<!-- Setting innerHTML (the fragment parser, then the old children removed) and reading it (the
     serializer), on fragments the size of a list a page re-renders. -->
<script src="../harness.js"></script>
<body>
<div id="host"></div>
<script>
const rand = perf.random(42);
let fragment = '';
for (let i = 0; i < 100; i++) {
  fragment += '<li class="row r' + (i % 5) + '" data-id="' + i + '"><a href="/item/' + i + '">Item ' + i +
    '</a> <span class="price">' + Math.floor(rand() * 1000) / 100 + '</span> <b>&amp; more</b></li>';
}
perf.add('dom.inner-html-set', {
  ops: 300,
  setup() { this.box = document.getElementById('host'); },
  run(n) { for (let i = 0; i < n; i++) this.box.innerHTML = '<ul>' + fragment + '</ul>'; },
  teardown() { this.box.textContent = ''; },
});
perf.add('dom.inner-html-get', {
  ops: 300,
  // Two boxes in turn: the same box read twice could be hoisted out of the loop by a JIT that
  // knows the getter is pure (Gecko marks innerHTML [Pure]).
  setup() {
    let html = '';
    for (let i = 0; i < 10; i++) html += '<ul>' + fragment + '</ul>';
    this.boxes = [document.createElement('div'), document.createElement('div')];
    for (const b of this.boxes) b.innerHTML = html;
  },
  run(n) { let k = 0; for (let i = 0; i < n; i++) k += this.boxes[i & 1].innerHTML.length; this.sink = k; },
});
perf.add('dom.insert-adjacent-html', {
  ops: 300,
  setup() { this.box = document.createElement('div'); },
  run(n) {
    for (let i = 0; i < n; i++) {
      this.box.insertAdjacentHTML('beforeend', '<p class="x">Paragraph <i>' + i + '</i></p>');
      if (this.box.childNodes.length > 200) this.box.textContent = '';
    }
  },
});
</script>
