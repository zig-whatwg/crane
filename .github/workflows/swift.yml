name: Swift Bindings

on:
  push:
    branches: [ main ]
    paths:
      - 'bindings/swift/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/swift.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bindings/swift/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/swift.yml'

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Zig library
        run: |
          zig build -Doptimize=ReleaseFast
          # Create universal library for macOS
          mkdir -p bindings/swift/Sources/CWhatWG/lib
          cp zig-out/lib/libwhatwg.a bindings/swift/Sources/CWhatWG/lib/

      - name: Build Swift Package
        working-directory: bindings/swift
        run: swift build

      - name: Run Tests
        working-directory: bindings/swift
        run: swift test

  build-ios:
    name: Build for iOS
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Zig library for iOS
        run: |
          # Build for iOS arm64
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-ios
          mkdir -p bindings/swift/Sources/CWhatWG/lib
          cp zig-out/lib/libwhatwg.a bindings/swift/Sources/CWhatWG/lib/

      - name: Build Swift Package for iOS (KNOWN BROKEN - CWhatWG.xcframework has no iOS slice)
        working-directory: bindings/swift
        run: |
          # KNOWN BROKEN, left failing on purpose. CWhatWG.xcframework/Info.plist
          # declares exactly one slice, macos-arm64, and that slice does not even
          # contain the libwhatwg.a its Info.plist names (only 4 headers are
          # committed). Nothing can link for iOS until an ios-arm64-simulator
          # slice exists. Do not re-add a `|| echo` to make this green.
          xcodebuild build \
            -scheme WhatWG \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run Tests on iOS Simulator (KNOWN BROKEN - CWhatWG.xcframework has no iOS slice)
        working-directory: bindings/swift
        run: |
          # KNOWN BROKEN, left failing on purpose. See the build step above.
          # A green tick here previously meant only that `echo` succeeded.
          xcodebuild test \
            -scheme WhatWG \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  lint:
    name: Swift Lint
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SwiftLint
        working-directory: bindings/swift
        run: |
          if ! command -v swiftlint &> /dev/null; then
            echo "::error::SwiftLint is not installed on this runner, so the Swift Lint job linted nothing. Install it or delete this job - do not let it report success."
            exit 1
          fi
          swiftlint lint --reporter github-actions-logging
