name: WPT Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:
    inputs:
      scope:
        description: 'WPT scope directory or test path (default: url/)'
        required: false
        default: 'url/'
        type: string

jobs:
  # The WPT runner's own unit and harness tests (all harness_sources modules
  # wired through build.zig with their host/clock/xml/poisoning imports, plus
  # ar3-command-lifetime and crashtest-execution).
  harness:
    name: WPT Harness Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig (the pinned 0.17)
        uses: ./.github/actions/setup-zig-pinned

      - name: Setup prebuilt V8 15.7.112.43 (static)
        uses: ./.github/actions/setup-v8-prebuilt
        with:
          link: static

      - name: Run WPT harness tests
        shell: bash
        run: zig build test -j2 -Dspec=wpt_runner -Dv8-dir="$CRANE_V8_DIR"

  # Runs a baselined WPT slice using Crane's production wpt_runner binary and
  # compares it against tests/wpt_expectations.jsonl. Any regression fails the job.
  #
  # To accept updated numbers intentionally:
  #   ./zig-out/bin/wpt_runner url/ --baseline=tests/wpt_expectations.jsonl --update-baseline
  # and commit the diff.
  wpt:
    name: WPT Baseline (${{ inputs.scope || 'url/' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code (with WPT submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig (the pinned 0.17)
        uses: ./.github/actions/setup-zig-pinned

      - name: Setup prebuilt V8 15.7.112.43 (static)
        uses: ./.github/actions/setup-v8-prebuilt
        with:
          link: static

      - name: Generate WPT MANIFEST.json and /etc/hosts entries
        shell: bash
        run: |
          set -euo pipefail
          ( cd tests/wpt && python3 ./wpt make-hosts-file | sudo tee -a /etc/hosts >/dev/null )
          ( cd tests/wpt && python3 ./wpt manifest --path MANIFEST.json )
          test -s tests/wpt/MANIFEST.json

      - name: Build production wpt_runner
        shell: bash
        run: zig build wpt-runner -j2 -Dv8-dir="$CRANE_V8_DIR"

      - name: Run WPT against baseline
        shell: bash
        env:
          WPT_SCOPE: ${{ inputs.scope || 'url/' }}
        run: |
          set -euo pipefail
          ./zig-out/bin/wpt_runner "${WPT_SCOPE}" \
            --output=wpt-results \
            --parallel=4 \
            --quiet \
            --baseline=tests/wpt_expectations.jsonl

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpt-results
          path: wpt-results/
          if-no-files-found: "${{ job.status == 'success' && 'error' || 'warn' }}"
