name: Release

# Manual-only fallback: releases and nightlies are built on local build server (server1).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry-run version label for archive names (e.g. v0.1.0-dryrun); never publishes a GitHub Release'
        required: false
        default: 'v0.1.0-dryrun'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            cpu_flag: '-Dcpu=apple_m1'
          - target: macos-x86_64
            os: macos-15-intel
            cpu_flag: '-Dcpu=baseline'
          - target: linux-x86_64
            os: ubuntu-24.04
            cpu_flag: '-Dcpu=baseline'
          - target: linux-arm64
            os: ubuntu-24.04-arm
            cpu_flag: '-Dcpu=baseline'

    steps:
      - name: Resolve release version label
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="${INPUT_VERSION:-v0.1.0-dryrun}"
          fi
          if ! [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::invalid release version label '$tag'"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Building release archive for tag/label: $tag (ref_type=$REF_TYPE)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig (the pinned 0.17)
        uses: ./.github/actions/setup-zig-pinned

      - name: Setup prebuilt V8 15.7.112.43 (static)
        uses: ./.github/actions/setup-v8-prebuilt
        with:
          link: static

      - name: Build release CLI (crane-release)
        shell: bash
        run: zig build crane-release -j2 ${{ matrix.cpu_flag }} -Dv8-dir="$CRANE_V8_DIR" -Dcrane-version="${RELEASE_TAG#v}" -Dcrane-git-sha="${GITHUB_SHA:0:9}"

      - name: Build release static library (crane-lib-release)
        shell: bash
        run: zig build crane-lib-release -j2 ${{ matrix.cpu_flag }} -Dv8-dir="$CRANE_V8_DIR"

      - name: Smoke test zig-out/bin/crane (--version and daemon console + SIGINT)
        shell: bash
        run: |
          set -euo pipefail
          test -x zig-out/bin/crane
          ./zig-out/bin/crane --version

          python3 - <<'PY'
          import os, select, signal, subprocess, sys, time

          cmd = [
              "./zig-out/bin/crane",
              "--remote-debugging-port=0",
              "--mcp-port=0",
              'data:text/html,<script>console.log("ran", 6*7)</script>',
          ]
          proc = subprocess.Popen(
              cmd,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              bufsize=0,
          )
          assert proc.stdout is not None
          fd = proc.stdout.fileno()
          os.set_blocking(fd, False)

          buf = bytearray()
          saw_ran_42 = False
          deadline = time.monotonic() + 30.0
          while time.monotonic() < deadline:
              r, _, _ = select.select([fd], [], [], 0.25)
              if r:
                  try:
                      chunk = os.read(fd, 4096)
                  except BlockingIOError:
                      chunk = b""
                  if chunk:
                      buf.extend(chunk)
                      if b"ran 42" in buf:
                          saw_ran_42 = True
                          break
                  elif proc.poll() is not None:
                      break
              elif proc.poll() is not None:
                  break

          if not saw_ran_42:
              if proc.poll() is None:
                  proc.kill()
                  proc.wait(timeout=5)
              print(buf.decode("utf-8", errors="replace"))
              print("::error::crane smoke test did not print 'ran 42' within 30s", file=sys.stderr)
              sys.exit(1)

          # Allow listeners and signal handling to settle, then send SIGINT (Ctrl-C).
          time.sleep(0.5)
          if proc.poll() is None:
              proc.send_signal(signal.SIGINT)

          stop_deadline = time.monotonic() + 15.0
          while time.monotonic() < stop_deadline:
              r, _, _ = select.select([fd], [], [], 0.2)
              if r:
                  try:
                      chunk = os.read(fd, 4096)
                      if chunk:
                          buf.extend(chunk)
                  except BlockingIOError:
                      pass
              if proc.poll() is not None:
                  while True:
                      try:
                          chunk = os.read(fd, 4096)
                          if not chunk:
                              break
                          buf.extend(chunk)
                      except BlockingIOError:
                          break
                  break

          rc = proc.poll()
          output = buf.decode("utf-8", errors="replace")
          print("=== crane daemon smoke output ===")
          print(output)
          if rc is None:
              proc.kill()
              proc.wait(timeout=5)
              print("::error::crane did not exit within 15s of SIGINT", file=sys.stderr)
              sys.exit(1)
          if rc != 0:
              print(f"::error::crane exited with status {rc} after SIGINT (expected 0)", file=sys.stderr)
              sys.exit(1)
          print("Smoke test passed: printed 'ran 42' and exited 0 on SIGINT")
          PY

      - name: Verify static linkage (system libraries only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess, sys

          runner_os = os.environ.get("RUNNER_OS", "")
          if runner_os == "macOS":
              out = subprocess.check_output(["otool", "-L", "zig-out/bin/crane"], text=True)
              print("=== otool -L zig-out/bin/crane ===")
              print(out)
              bad = []
              for line in out.splitlines()[1:]:
                  entry = line.strip()
                  if not entry:
                      continue
                  path = entry.split(" (", 1)[0].strip()
                  if not (
                      path.startswith("/System/Library/Frameworks/")
                      or path.startswith("/usr/lib/")
                  ):
                      bad.append(path)
              if bad:
                  for p in bad:
                      print(f"::error::non-system dynamic library linked into release binary: {p}", file=sys.stderr)
                  sys.exit(1)
              print("macOS linkage audit passed: system libraries only")
          else:
              out = subprocess.check_output(["ldd", "zig-out/bin/crane"], text=True)
              print("=== ldd zig-out/bin/crane ===")
              print(out)
              allowed_names = re.compile(
                  r"^(linux-vdso\.so(\.[0-9]+)?|ld-linux-[a-z0-9_-]+\.so\.[0-9]+|"
                  r"libc\.so\.[0-9]+|libm\.so\.[0-9]+|libpthread\.so\.[0-9]+|"
                  r"libdl\.so\.[0-9]+|librt\.so\.[0-9]+|libgcc_s\.so\.[0-9]+|"
                  r"libresolv\.so\.[0-9]+|libsqlite3\.so\.[0-9]+)$"
              )
              bad = []
              for raw in out.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if "not found" in line:
                      bad.append(f"unresolved library: {line}")
                      continue
                  if "=>" in line:
                      left, right = line.split("=>", 1)
                      name = os.path.basename(left.strip())
                      resolved = right.strip().split()[0]
                      if not (
                          resolved.startswith("/lib/")
                          or resolved.startswith("/lib64/")
                          or resolved.startswith("/usr/lib/")
                      ):
                          bad.append(f"non-system library path: {line}")
                          continue
                  else:
                      token = line.split()[0]
                      name = os.path.basename(token)
                  if not allowed_names.match(name):
                      bad.append(f"non-system shared library: {line}")
              if bad:
                  for msg in bad:
                      print(f"::error::{msg}", file=sys.stderr)
                  sys.exit(1)
              print("Linux linkage audit passed: system libraries only")
          PY

      - name: Package release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          pkg_name="crane-${RELEASE_TAG}-${TARGET}"
          tarball="${pkg_name}.tar.gz"
          stage="$RUNNER_TEMP/release-stage/$pkg_name"
          rm -rf "$RUNNER_TEMP/release-stage"
          mkdir -p "$stage/bin" "$stage/lib" "$stage/include"

          # Required artifacts: strict checks, never ship an incomplete archive.
          test -x zig-out/bin/crane
          test -f zig-out/lib/libcrane.a
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md

          cp zig-out/bin/crane "$stage/bin/crane"
          if [ -f zig-out/bin/whatwg_snapshot.bin ]; then
            cp zig-out/bin/whatwg_snapshot.bin "$stage/bin/whatwg_snapshot.bin"
          fi
          cp zig-out/lib/libcrane.a "$stage/lib/libcrane.a"

          if [ -f zig-out/include/crane.h ]; then
            cp zig-out/include/crane.h "$stage/include/crane.h"
          elif [ -f include/crane.h ]; then
            cp include/crane.h "$stage/include/crane.h"
          else
            echo "::error::crane.h not found in zig-out/include/ or include/"
            exit 1
          fi

          cp LICENSE "$stage/LICENSE"
          cp THIRD_PARTY_NOTICES.md "$stage/THIRD_PARTY_NOTICES.md"

          mkdir -p dist
          if [ "${RUNNER_OS}" = "macOS" ]; then
            COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "dist/$tarball" -C "$RUNNER_TEMP/release-stage" "$pkg_name"
          else
            tar -czf "dist/$tarball" -C "$RUNNER_TEMP/release-stage" "$pkg_name"
          fi

          echo "=== Archive contents: dist/$tarball ==="
          tar -tzvf "dist/$tarball"
          ls -lh "dist/$tarball"

      - name: Upload target archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: crane-release-${{ matrix.target }}
          path: dist/crane-*.tar.gz
          if-no-files-found: error

  release:
    name: Checksums & Publish Release
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release version label
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="${INPUT_VERSION:-v0.1.0-dryrun}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download all 4 target archives
        uses: actions/download-artifact@v4
        with:
          pattern: crane-release-*
          merge-multiple: true
          path: dist

      - name: Verify all 4 archives and generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          for target in macos-arm64 macos-x86_64 linux-x86_64 linux-arm64; do
            f="dist/crane-${RELEASE_TAG}-${target}.tar.gz"
            if [ ! -f "$f" ]; then
              echo "::error::missing expected release archive $f"
              exit 1
            fi
          done
          ( cd dist && sha256sum crane-*.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt )
          echo "=== SHA256SUMS.txt ==="
          cat dist/SHA256SUMS.txt

      - name: Upload combined release bundle artifact (archives + SHA256SUMS.txt)
        uses: actions/upload-artifact@v4
        with:
          name: crane-release-bundle-${{ env.RELEASE_TAG }}
          path: |
            dist/crane-*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub Release (tags only)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          flags=(--generate-notes --verify-tag)
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/crane-*.tar.gz dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/crane-*.tar.gz dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi
          echo "Published GitHub Release $tag with 4 target archives and SHA256SUMS.txt"

      - name: Dry-run notice (workflow_dispatch)
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          echo "Dry-run complete (ref_type=${GITHUB_REF_TYPE}, label=${RELEASE_TAG}): uploaded all 4 archives and SHA256SUMS.txt as workflow artifacts; did NOT create a GitHub Release."
