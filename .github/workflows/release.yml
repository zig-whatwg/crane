name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-libraries:
    name: Build Native Libraries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            artifact: libwhatwg-linux-x86_64
          - os: macos-14
            target: aarch64-macos
            artifact: libwhatwg-macos-arm64
          - os: macos-14
            target: x86_64-macos
            artifact: libwhatwg-macos-x86_64
          - os: windows-latest
            target: x86_64-windows-gnu
            artifact: whatwg-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build library
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} || zig build -Doptimize=ReleaseFast

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp zig-out/lib/libwhatwg.a dist/ || true
          cp zig-out/lib/libwhatwg.so dist/ || true
          cp zig-out/lib/libwhatwg.dylib dist/ || true
          cp -r include dist/
          tar -czvf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item zig-out/lib/whatwg.lib dist/ -ErrorAction SilentlyContinue
          Copy-Item zig-out/lib/whatwg.dll dist/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse include dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip

  build-swift:
    name: Build Swift XCFramework
    runs-on: macos-14
    needs: build-libraries
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build for macOS arm64
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
          mkdir -p build/macos-arm64
          cp zig-out/lib/libwhatwg.a build/macos-arm64/ || true

      - name: Build for macOS x86_64
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-macos
          mkdir -p build/macos-x86_64
          cp zig-out/lib/libwhatwg.a build/macos-x86_64/ || true

      - name: Build for iOS arm64
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-ios || true
          mkdir -p build/ios-arm64
          cp zig-out/lib/libwhatwg.a build/ios-arm64/ || true

      - name: Build for iOS Simulator
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-ios-simulator || true
          mkdir -p build/ios-simulator
          cp zig-out/lib/libwhatwg.a build/ios-simulator/ || true

      - name: Create XCFramework
        run: |
          # Create universal macOS library
          mkdir -p build/macos-universal
          lipo -create \
            build/macos-arm64/libwhatwg.a \
            build/macos-x86_64/libwhatwg.a \
            -output build/macos-universal/libwhatwg.a 2>/dev/null || \
            cp build/macos-arm64/libwhatwg.a build/macos-universal/ || true
          
          # Create XCFramework structure (simplified)
          mkdir -p WhatWG.xcframework
          echo "XCFramework creation requires full Xcode project setup"

      - name: Package Swift
        run: |
          tar -czvf whatwg-swift.tar.gz bindings/swift/

      - name: Upload Swift artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatwg-swift
          path: whatwg-swift.tar.gz

  build-kotlin:
    name: Build Kotlin AAR
    runs-on: ubuntu-latest
    needs: build-libraries
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build AAR
        working-directory: bindings/kotlin
        run: |
          ./gradlew assembleRelease --no-daemon || echo "AAR build requires full Android SDK setup"

      - name: Package Kotlin
        run: |
          tar -czvf whatwg-kotlin.tar.gz bindings/kotlin/

      - name: Upload Kotlin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whatwg-kotlin
          path: whatwg-kotlin.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-libraries, build-swift, build-kotlin]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
