name: Kotlin Bindings

on:
  push:
    branches: [ main ]
    paths:
      - 'bindings/kotlin/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/kotlin.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bindings/kotlin/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/kotlin.yml'

jobs:
  build:
    name: Build Android Library
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Zig library for Android (arm64-v8a only, KNOWN BROKEN)
        run: |
          # Build for different Android architectures
          mkdir -p bindings/kotlin/whatwg/src/main/jniLibs/arm64-v8a
          mkdir -p bindings/kotlin/whatwg/src/main/jniLibs/armeabi-v7a
          mkdir -p bindings/kotlin/whatwg/src/main/jniLibs/x86_64
          mkdir -p bindings/kotlin/whatwg/src/main/jniLibs/x86
          
          # Build for arm64-v8a.
          #
          # KNOWN BROKEN - this is expected to fail today, and it must fail
          # visibly instead of being swallowed by `|| true`:
          #   * only arm64-v8a is attempted, so three of the four ABI
          #     directories created above are always left empty;
          #   * whatwg/src/main/cpp/jni_bridge.cpp calls whatwg_version_string,
          #     whatwg_context_create, whatwg_context_evaluate and other C
          #     symbols that no Zig code exports, so the JNI layer cannot link
          #     even once this command starts succeeding.
          # Do not re-add `|| true`. Fix the Android build or the C exports.
          zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-android

          # A green step has to mean a real artifact exists. This replaces the
          # previous `echo "Android native library build requires NDK integration"`,
          # which asserted the Android goal instead of verifying it.
          if [ ! -f zig-out/lib/libwhatwg.so ]; then
            echo "::error::zig build reported success but produced no zig-out/lib/libwhatwg.so for aarch64-linux-android"
            exit 1
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle (KNOWN BROKEN - no Gradle wrapper is committed)
        working-directory: bindings/kotlin
        run: |
          # There is no bindings/kotlin/gradlew and no bindings/kotlin/gradle/wrapper
          # in the repository, so this step has never actually built anything. The
          # failure used to be hidden by `|| echo "Gradle build requires Android SDK setup"`.
          if [ ! -x ./gradlew ]; then
            echo "::error::bindings/kotlin/gradlew is missing or not executable - the Gradle wrapper was never committed, so the Android library has never been built by CI"
            exit 1
          fi
          ./gradlew assembleDebug --no-daemon

      - name: Run Unit Tests (KNOWN BROKEN - no Gradle wrapper is committed)
        working-directory: bindings/kotlin
        run: |
          # `|| echo "Tests require Android SDK setup"` previously reported success
          # for a test run that never happened.
          if [ ! -x ./gradlew ]; then
            echo "::error::bindings/kotlin/gradlew is missing or not executable - the Gradle wrapper was never committed, so the Kotlin unit tests have never run in CI"
            exit 1
          fi
          ./gradlew test --no-daemon

  instrumented-tests:
    name: Android Instrumented Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check Gradle wrapper before booting an emulator (KNOWN BROKEN)
        working-directory: bindings/kotlin
        run: |
          # Fail here rather than after a multi-minute emulator boot. The job
          # still fails; it just fails honestly and quickly.
          if [ ! -x ./gradlew ]; then
            echo "::error::bindings/kotlin/gradlew is missing or not executable - the Gradle wrapper was never committed, so Android instrumented tests have never run in CI"
            exit 1
          fi

      - name: Run Instrumented Tests (whatwg/src/androidTest does not exist)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 6
          # No `|| echo "Instrumented tests require full setup"` fallback: a failing
          # instrumented test run must fail the job. Note that there is currently no
          # whatwg/src/androidTest source set, so connectedAndroidTest has no tests
          # to execute even once the wrapper exists.
          script: cd bindings/kotlin && ./gradlew connectedAndroidTest --no-daemon

  lint:
    name: Kotlin Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run ktlint (KNOWN BROKEN - no Gradle wrapper, no ktlint plugin)
        working-directory: bindings/kotlin
        run: |
          # This used to print "Gradle wrapper not found" or "ktlint not configured"
          # and exit 0, so the "Kotlin Lint" job was green while linting nothing.
          # Both of those conditions are real failures.
          if [ ! -x ./gradlew ]; then
            echo "::error::bindings/kotlin/gradlew is missing or not executable - the Gradle wrapper was never committed, so ktlint has never run in CI"
            exit 1
          fi
          # No ktlint plugin is applied in bindings/kotlin/build.gradle.kts or
          # bindings/kotlin/whatwg/build.gradle.kts, so this task does not exist
          # yet and this command is expected to fail until it is added.
          ./gradlew ktlintCheck --no-daemon
