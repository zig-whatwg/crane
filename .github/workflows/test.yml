name: Test Suite

# KNOWN-RED ON A CLEAN CHECKOUT. Read this before "fixing" a failure here.
#
# Every step in this file invokes a `zig build` step that statically links V8
# out of jsengines/v8/out/static/obj/*.a. That is true of the default install
# step (build.zig: full_static_lib, repl_exe, minimal_snapshot_test_exe,
# wpt_runner_exe) and of `zig build test`, which calls
# addTestFilesFromDir(..., link_v8=true) for tests/html, tests/v8 and
# tests/benchmarks.
#
# Nothing under jsengines/ is tracked: `git ls-files jsengines/` is empty and
# .gitignore line 47 excludes jsengines/v8/. So a fresh CI checkout has no
# libv8_monolith.a (~68 MB on a developer machine) and no jsengines/v8/include,
# and the link dies in hundreds of undefined _v8_* / _uv_* symbols.
#
# build.zig also hardcodes /opt/homebrew/opt/libuv/{lib,include} for those same
# artifacts. That path exists only under Homebrew on Apple Silicon, so the
# ubuntu-latest and windows-latest matrix legs cannot succeed even once V8 is
# provisioned.
#
# And `zig build test` is red even on a machine that DOES have the archives.
# Measured on main: 257/262 steps succeeded; 3 failed; 3757/3763 tests passed;
# 2 failed; 2 leaked.
#
# These jobs are deliberately left enabled and failing. A red job that names its
# cause is worth more than a green one that hides it. Do NOT paper this over
# with continue-on-error, `|| true`, or a fallback build that produces a
# different artifact than the one under test. Fix the provisioning (vendor or
# download the V8 archives, unhardcode the libuv path) or fix the tests.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          # The project's toolchain is 0.15.2 (README badge, .github/workflows/wpt.yml,
          # and the 0.15.2-specific workarounds in src/js_bindings/registry.zig).
          # build.zig.zon's minimum_zig_version = "0.15.1" is a floor, not the pin.
          version: 0.15.2

      # Advisory only - deliberately does NOT exit non-zero.
      #
      # `zig build test` links V8 in just 4 of ~21 test groups (tests/dom,
      # tests/html, tests/v8, tests/benchmarks - the `link_v8 = true` call sites
      # in build.zig). The other ~17 groups - infra, webidl, url, encoding,
      # streams, selector, fetch, csp and the rest - build and run with no V8 at
      # all, and account for the large majority of the ~3,700 tests that pass.
      #
      # Hard-failing here would abort before any of them ran, so a URL-parser
      # regression would surface as "missing libv8_monolith.a". The V8-linked
      # groups will fail on their own, loudly, in the step below; this note just
      # explains why when they do.
      - name: Preflight - note whether V8 archives are present (advisory)
        shell: bash
        run: |
          set -uo pipefail
          for path in \
            jsengines/v8/include \
            jsengines/v8/out/static/obj/libv8_monolith.a \
            jsengines/v8/out/static/obj/libv8_libplatform_fat.a \
            jsengines/v8/out/static/obj/libv8_libbase_fat.a
          do
            if [ ! -e "$path" ]; then
              echo "::warning::missing $path - jsengines/ is gitignored and is not vendored or downloaded by this workflow, so the 4 V8-linked test groups cannot link. The other ~17 groups still run and report below."
            fi
          done

      - name: Run tests (V8-linked groups will fail without jsengines/; also red on main - see file header)
        run: zig build test --summary all

  # Fetch network tests - run separately with network access
  fetch-network-tests:
    name: Fetch Network Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          # See the version note in the `test` job above.
          version: 0.15.2

      - name: Preflight - V8 archives must be present to link (see file header)
        shell: bash
        run: |
          set -uo pipefail
          missing=0
          for path in \
            jsengines/v8/include \
            jsengines/v8/out/static/obj/libv8_monolith.a \
            jsengines/v8/out/static/obj/libv8_libplatform_fat.a \
            jsengines/v8/out/static/obj/libv8_libbase_fat.a
          do
            if [ ! -e "$path" ]; then
              echo "::error::missing $path - jsengines/ is gitignored and is not vendored or downloaded by this workflow, so nothing here can link V8"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build with static libcurl
        run: zig build

      # No continue-on-error here on purpose. It used to carry the note "Allow
      # network test failures as httpbin.org may be unavailable", but this step
      # runs the ENTIRE suite (3,763 tests) with WHATWG_NETWORK_TESTS=1 set, not
      # only the network ones, so continue-on-error swallowed every unrelated
      # regression and leak alongside any httpbin outage. If httpbin flakiness
      # needs tolerating, scope the tolerance to the network tests in build.zig
      # or point them at a hermetic server - do not blanket-ignore the suite.
      - name: Run fetch network integration tests (whole suite; red on main)
        run: zig build test --summary all
        env:
          # Enable network tests
          WHATWG_NETWORK_TESTS: "1"

      - name: Verify libcurl integration compiles
        run: |
          # Verify the fetch module with libcurl compiles correctly
          zig build -Dsystem-curl=false
          echo "Static libcurl build successful"
