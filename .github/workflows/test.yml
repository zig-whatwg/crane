name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Fast std-only check: the pinned Zig from the toolchain release, version check,
  # and build.zig's toolchain refusal tests (tools/zig_toolchain.zig).
  toolchain:
    name: Pinned Zig on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig (the pinned 0.17)
        uses: ./.github/actions/setup-zig-pinned

      - name: Verify zig version matches pin
        shell: bash
        run: |
          set -euo pipefail
          got="$(zig version)"
          echo "zig $(command -v zig): $got"
          [ "$got" = "0.17.1-dev+77c319a0f0" ] || {
            echo "::error::zig version is '$got', not 0.17.1-dev+77c319a0f0"
            exit 1
          }

      - name: Run tools/zig_toolchain.zig tests
        shell: bash
        run: zig test tools/zig_toolchain.zig

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig (the pinned 0.17)
        uses: ./.github/actions/setup-zig-pinned

      - name: Setup prebuilt V8 15.7.112.43 (static)
        uses: ./.github/actions/setup-v8-prebuilt
        with:
          link: static

      - name: Run unit & integration tests (includes lints and codegen-check)
        shell: bash
        run: zig build test -j2 -Dv8-dir="$CRANE_V8_DIR"

      - name: Run browser initialization tests
        shell: bash
        run: zig build test-browser -j2 -Dv8-dir="$CRANE_V8_DIR"

      - name: Verify -Dcdp=false build
        shell: bash
        run: zig build check-cdp-off -j2 -Dv8-dir="$CRANE_V8_DIR"

      - name: Build crane and run version smoke test
        shell: bash
        run: |
          set -euo pipefail
          zig build crane -j2 -Dv8-dir="$CRANE_V8_DIR" -Dcrane-git-sha="${GITHUB_SHA:0:9}"
          ./zig-out/bin/crane --version

      - name: Test out-of-tree Zig consumer (Zig module & C ABI samples)
        shell: bash
        run: |
          set -euo pipefail
          cd examples/zig-consumer
          zig build test -j2 -Dv8-dir="$CRANE_V8_DIR"
          zig build -j2 -Dv8-dir="$CRANE_V8_DIR"
          count=0
          for bin in zig-out/bin/*; do
            if [ -f "$bin" ] && [ -x "$bin" ]; then
              echo "--- running sample binary: $bin"
              "$bin"
              count=$((count + 1))
            fi
          done
          if [ "$count" -lt 2 ]; then
            echo "::error::expected at least 2 sample binaries (Zig module + C ABI) in examples/zig-consumer/zig-out/bin/, found $count"
            ls -la zig-out/bin/ || true
            exit 1
          fi
