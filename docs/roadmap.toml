[[infra]]
id = "networking"
title = "Asynchronous networking"
why = """fetch() blocks the whole process in curl_easy_perform, so infinite \
responses, polling helpers (common/dispatcher/dispatcher.js, loaded by 251 \
html/ sources) and streaming bodies cannot work. XHR, fetch, workers, \
WebSockets and navigation all sit on it."""
done_when = "Fetches complete on the event loop and response bodies stream."
areas = ["fetch/", "xhr/"]
progress = [
  "70278c0d1 - window fetch() completes on the event loop: a curl multi scheduler pumped each turn (networking lane, increment 1)",
  "066da9ed2 - asynchronous XHR on the same scheduler, XHR handlers on EventTarget's map, fetch() abort steps (increment 2); worker fetch() async through the bound operation (9ec30ea8f)",
  "64e40148e - response bodies stream: headers first, a body pipe each clone reads, response.body filled by the network, XHR progress as bytes arrive (increment 3)",
  "a93d2b413 - subresources on the same path: link and style style sheets with their @imports fire load/error and delay the document's load, link preload fetches; 2f89c234e hyperlink auditing pings (networking lane)",
]

  [[infra.items]]
