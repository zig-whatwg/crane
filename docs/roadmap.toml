[[infra]]
id = "navigation"
title = "Navigation and document lifecycle"
why = """Navigation is synchronous, a frame keeps its Window across a navigation \
(a new document should get a new Window), and there is no session history. \
History, links, form submission, windows and bfcache all build on this."""
done_when = """A navigated document gets a new Window, navigation runs as the \
spec's tasks, and session history exists for features to build on."""
areas = ["html/browsers/browsing-the-web/", "html/browsers/history/", "html/semantics/links/", "html/browsers/windows/", "navigation-api/"]
progress = [
  "46773ea0db - persistent document.write and navigation parsers retain their stream and loader through stylesheet waits; parserless documents complete their lifecycle; document abort owns fetch cancellation and task delivery (document.write lane)",
  "40586ce295 - row 11 review corrections: a reentrant document.open replaces the parser its handlers installed; a completed XHR ignores a queued document abort; parser continuation after a load delay ends runs only from a task; parser references live in collectible traced storage; a retained inactive document can be reopened (document.write lane)",
  "f03633d6a - frame and popup navigation runs as the spec's tasks (beforeunload, fetch via AsyncFetch, commit); frames delay their container's load event; unload/pagehide fire; markup <iframe src> navigates (navigation lane, increment 1)",
  "8f9eb9371, 88f09482e, 05a30200a, 4797fefa0, dd792cb0f (merged 505cfb9e3) - the about base URL, document.open() erases listeners, sessionStorage per traversable, document.domain sets the origin domain, a destroyed document's defaultView is null, and the Window keeps its Storage and CustomElementRegistry alive (navigation lane, increment 3)",
  "3c46ac8da (merged bd798db40) - the navigation API's hangs, window.close() with its definitely-close task, the Location setters, the window scroll methods, the storage event broadcast, POST form submission, BroadcastChannel, ImageData; named access returns the iframe element (navigation lane, batches 1-2)",
  "eb2162471 - meta refresh (the Refresh pragma and the shared declarative refresh steps), the srcdoc navigate event, dispose across navigables, BroadcastChannel in closing workers, planned form navigation after reparenting, batch 3's BarProp and initial about:blank fixes (navigation lane, final batch)",
  "35dc32ef6..eceadb5b4 (merged 5803428e4) - pageswap and NavigationActivation (navigation.activation), the joint history's reserved entries and child steps, cross-window navigate events (same origin-domain, the navigable's own document), frame Referer, top-level javascript: URLs, navigator.keyboard (navigation lane, batch 5)",
  "70f11029e5 (merged 07ba782f8a) - navigation batch 6: a Window's navigable, navigate event handler steps, document.referrer, beforeunload, rate limit, fragment popstate, window.open geometry, download navigations, traversal order, Content-Type as Fetch extracts it, blob: frames through scheme fetch (navigation lane)",
  "79327bce39 (merged a3c966f636) - navigation batch 7: blob: documents load with their source's policies, noopener name lookup and browsing context groups, <frame> content navigables, the response URL is the request's, history and javascript: URL policy containers, window.postMessage transfer (nav7 lane)",
  "c4be0eb872 - every load makes a new Document; the replaced one is aborted, unloaded when it had loaded, and never emptied (newdoc)",
  "3852465fda - browsers-first flips: form.submit() cancellation, NavigationHistoryEntry.url censoring, blob: history policy containers, intercept() promise identity (promiseResolve), cross-origin top navigation without activation blocked, parent load after its last child (navflip)",
  "372e36cb58c - a top-level realm a navigation replaced is detached like a frame's (its successor takes its context and isolate entries); window.open's realm follows its opener's WindowProxy (WindowRealmOptions.auxiliary) (newwin1 E1/E2)",
  "14f95a7742c - the host page's top-level traversable is a navigable record that owns its browsing context across Windows (dom.top_level_traversables) (newwin1 B2)",
  "493207da804 - a load that replaces a page's loaded document gives it a new Window behind the same WindowProxy; the old realm detached and its cleanup steps run; a load asked for under the page's own parse waits for it (newwin1 B3)",
  "873d6e9bcf4 - pushState on an initial about:blank document replaces its entry (URL and history update steps step 4) (newwin1 S4)",
  "0c100a019f5 - a frame's initial about:blank Window is reused only when same origin-domain with the next document (newwin1 B6)",
  "6933bdd6ccd - an embedder's loads push or replace session history entries (navigate steps 13-14), keeping their markup so a traversal re-creates the page (newwin1 B4)",
  "7581660bc4f, 5277a774ad0, b7627990b98 - the host page keeps its old Location path's file: refusal and queued javascript: URLs, and window.stop cancels a document's forms' planned navigations (Blink CancelFormSubmission, WebKit NavigationScheduler) (newwin1)",
  "47356e5067b - popups move with their opener's navigable at a Window swap (the new Window keeps them; their realms are auxiliary and follow the opener's WindowProxy; their parent realm is the opener's current one) (newwin1 B7)",
  "cb3d11033ed - the host page navigates as a popup does: Location, hyperlinks, forms, Refresh, javascript: URLs, reload and traversal reach its traversable record (dom.top_level_navigation retired); Context.navigate / Browser.navigateInPlace for the embedder; WebDriver Navigate To in place (newwin1 B5)",
  "13b9f7bd156 - each navigable's view of the session history (History length/index, the navigation API entry list and current entry) is stored, written when the history changes; the views the later reordering writes at the spec's moments (nav2 D)",
  "e18de2201dc - history and navigation API traversals run on the traversable's session history traversal queue, each waiting for its cross-document populations until their documents are active; the leaving document keeps its view; delta traversals follow the browsers: a top-level traversable ignores further ones while one is pending, a child navigable coalesces them (nav2 C1)",
  "307e27019ea - \"apply the history step\" proper (apply_history_step.zig): per-navigable change tasks with the traverse navigate event, step 18's length/index updates and the current step set last; a traversing navigable ignores navigations (ongoing navigation \"traversal\"); reload and the updates for navigable creation/destruction are queue items (nav2 C2)",
  "d74b3cdf00e, e94d5808576 - same-document navigations (pushState/replaceState, fragment navigations) finalize on the traversal queue: their entries are pending until listed, a traversal queued before them computes its endpoint from the original placement, and their finalize jumps a waiting traversal (14.1); every document's view reads the pending entries at once; a same-document traversal ends a navigation in flight (14.10.1) (nav2 E)",
  "66a94c84d0e, ab942228a3d - fragment navigation cost: the joint session history's lookups by id and navigable are indexed, clear-forward is one compaction, the views are written into kept buffers, and the navigation API's dispose check is linear (nav2 H)",
  "a26b9c16d1b, 3e2c123672b, 0ecb930d82c - \"finalize a cross-document navigation\" is a queue item: the entry is listed before the displayed document unloads, the commit waits for the items queued before it, and a mature navigation commits even when a later one started (nav2 F1; the host page's Context.navigate through it, F2)",
  "771201f4a2d, 3a3ddd1dd3a, 089dc3cad2b - a planned form navigation cancels a javascript: URL queued in its target; about:srcdoc outside srcdoc= is a network error; an about:blank navigation carries main fetch's referrer; a removed frame's subtree is discarded at once; inner invoke skips listeners of not-fully-active Windows, with navigation API detach events before the frame unloads (lane nav2 batch 9)",
  "b71bed67931, 888a45c6606, e60c4023484, b02a80c2163, b2748a71424, 3ec3cbddd25, 460f7ed4e86, 4baea65e2de, 36e5b43bce0, 45c3680d5af, d2d4d861fee - 0.1 blockers (blk3): PerformanceNavigationTiming toJSON()/confidence; WindowProxy [[Delete]] of an index; the named properties object's [[Prototype]] is EventTarget.prototype; a child navigable's name is no longer an own property of its parent's global (an invented path removed); process scroll behavior scrolls to the beginning of the document and clears :target (Chrome + WebKit); no API method tracker for a non-API navigation (whatwg/html#13024); not restored reasons null after a redirected traversal (Chromium); the bfcache keeps a page whatever its status (Firefox + Safari); worker script fetches reach the owner's resource timing; navigation responseEnd 0 while the body arrives; a cached page's frames dispose pruned entries after pageshow"
]

