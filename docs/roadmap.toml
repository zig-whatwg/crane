  "71b40ef7a1, 3b05ac5527, 817cdd3d79 - refcount steps 1 and 2 (rc12): pins for retention, listener cycles, D1 and D6 (known-red until their step), the Ref/GCReachableRef/WeakRef types with the Debug ledger and count fields in NodeBase (456 B until nodeholds' holds go), lint-refcount; no behaviour change. Found: a windowless document held only through a detached node is freed under it (crash)",
