why = """V8 is statically linked on desktop and server; iOS will dynamically link \
the system JavaScriptCore. A second adapter can only replace V8 at a seam the \
rest of the engine respects, and every direct V8 call outside the adapter is \
work it must undo first (AGENTS.md, "The engine boundary")."""
done_when = """tools/engine_boundary_baseline.txt is empty, the runtime Engine table \
is deleted, "v8" is gone from the non-adapter modules' imports in build.zig, and a \
non-V8 build fails only on explicit NotSupported entries."""
