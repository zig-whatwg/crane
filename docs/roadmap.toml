  "eb2162471 - meta refresh (the Refresh pragma and the shared declarative refresh steps), the srcdoc navigate event, dispose across navigables, BroadcastChannel in closing workers, planned form navigation after reparenting, batch 3's BarProp and initial about:blank fixes (navigation lane, final batch)",
  "35dc32ef6..eceadb5b4 (merged 5803428e4) - pageswap and NavigationActivation (navigation.activation), the joint history's reserved entries and child steps, cross-window navigate events (same origin-domain, the navigable's own document), frame Referer, top-level javascript: URLs, navigator.keyboard (navigation lane, batch 5)",
