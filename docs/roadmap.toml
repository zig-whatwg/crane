# Crane engine roadmap.
#
# The shared infrastructure to finish before feature areas are handed to agents
# working in parallel on other machines, the prerequisites for that parallel
# work, and the areas that can be handed out afterwards. Rendered by
# tools/wpt_progress.py into wpt-results/progress.html next to the WPT gate.
#
# Keep it current as work lands: flip an item's `status`, and add a line to
# `progress` naming the commit. Statuses are "todo", "doing" or "done"; an
# infrastructure piece's own status follows from its items. Anything the report
# can measure it measures itself - blocking files per `areas` prefix, retained
# heap per file, commits not yet pushed - so write no numbers here that would
# go stale.

[meta]
goal = """Establish the engine's shared infrastructure first, then hand isolated \
feature areas to parallel agents that never need to change it."""

# ---------------------------------------------------------------------------
# Engine infrastructure
# ---------------------------------------------------------------------------

[[infra]]
id = "lifetime"
title = "Object lifetime and V8 handle ownership"
why = """Every feature allocates V8 handles, and a finished page is never freed: \
listener callbacks, on* handler values and wrapper-cache strong holds pin its \
whole context. In a long sweep that is V8 FatalProcessOutOfMemory - 11 of 18 \
crashes in the dc36e6b3b sweep. Left open, every agent meets it and patches the \
same binding files differently."""
done_when = """Retained heap stays flat across a sweep shard (CRANE_HEAP_GC=1), \
and the tracing decision - V8 TracedReference / cppgc versus manual \
disposal - is made once."""
metric = "heap"
progress = [
  "26626c087 - bindings release the context handles they take: live Global<Context> after 8 pages 431 -> 101",
  "journal records heap_used_kb; CRANE_HEAP_GC and CRANE_HEAP_SNAPSHOT diagnose retention",
  "0100e3e5b - per-context registration releases its handles; callback registry resets a torn-down context's callbacks: live handles after 8 pages 21,469 -> 16,788",
  "f2d429ab5 - legacy platform object wrappers release the proxied target: a simple page no longer retains anything",
  "50d353245 - method results the binding owns are released; promises are handed over",
  "acc6a45fb - inert dictionaries, unions, sequences and Instance pointers release their context; receiver contexts released: live context handles after 6 pages 50 -> 14",
  "bb4a19e46 - argument, dictionary-member and promise-resolver handles released once copied",
  "ef7e6e2fa - callback wrappers own their context; setter, contentWindow and security-token leaks fixed: retained memory falls for the first time",
  "9fd458bfe - journal records live V8 native contexts per file (exact, where heap is noisy)",
  "875a0db20 - a destroyed frame releases its own handles (context, Window constructor, intrinsics, global); variadic arguments released",
  "7b265eb8f - the event handler map owns its values: 40 frame files leave 21 live contexts, not 102",
]

  [[infra.items]]
  name = "Binding callbacks release the context, holder and value handles they take"
  status = "done"

  [[infra.items]]
  name = "Per-context registration releases what it installs (methods, namespaces, window globals)"
  status = "done"

  [[infra.items]]
  name = "Callback registry resets a context's callbacks when the context is torn down"
  status = "done"

  [[infra.items]]
  name = "Legacy platform object wrappers release the proxied target's handle"
  status = "done"

  [[infra.items]]
  name = "Return values: the binding owns and releases what conversion hands it (promises, objects, strings)"
  status = "done"

  [[infra.items]]
  name = "Dictionaries and unions of inert types recognized as not retaining the context (fetch, Headers)"
  status = "done"

  [[infra.items]]
  name = "Argument handles released when conversion copied out of them (dictionaries, Instance arguments)"
  status = "done"

  [[infra.items]]
  name = "Callback wrappers own a copy of their context, so the binding releases its own (EventTarget.addEventListener, on* setters)"
  status = "done"

  [[infra.items]]
  name = "A torn-down frame releases its own handles (context, constructors, intrinsics, global proxy)"
  status = "done"

  [[infra.items]]
  name = "on* event handler values released when replaced and at teardown"
  status = "done"

  [[infra.items]]
  name = "Wrapper cache stops holding torn-down wrappers strongly (markAsCleanedUp)"
  status = "todo"

  [[infra.items]]
  name = "Native timers release their handler and context handles"
  status = "done"

  [[infra.items]]
  name = "JSValue arguments borrowed by default; an impl that keeps one clones it (as Blink's ScriptValue)"
  status = "todo"

  [[infra.items]]
  name = "Decide tracing (TracedReference / cppgc) versus manual disposal"
  status = "todo"

  [[infra.items]]
  name = "Event listeners and handlers are traced from their target, not held as strong roots - today a target whose listener closure captures the target can never be collected (Blink traces listeners from the target)"
  status = "todo"

[[infra]]
id = "navigation"
title = "Navigation and document lifecycle"
why = """Navigation is synchronous, a frame keeps its Window across a navigation \
(a new document should get a new Window), and there is no session history. \
History, links, form submission, windows and bfcache all build on this."""
done_when = """A navigated document gets a new Window, navigation runs as the \
spec's tasks, and session history exists for features to build on."""
areas = ["html/browsers/browsing-the-web/", "html/browsers/history/", "html/semantics/links/", "html/browsers/windows/", "navigation-api/"]
progress = [
  "f03633d6a - frame and popup navigation runs as the spec's tasks (beforeunload, fetch via AsyncFetch, commit); frames delay their container's load event; unload/pagehide fire; markup <iframe src> navigates (navigation lane, increment 1)",
  "8f9eb9371, 88f09482e, 05a30200a, 4797fefa0, dd792cb0f (merged 505cfb9e3) - the about base URL, document.open() erases listeners, sessionStorage per traversable, document.domain sets the origin domain, a destroyed document's defaultView is null, and the Window keeps its Storage and CustomElementRegistry alive (navigation lane, increment 3)",
